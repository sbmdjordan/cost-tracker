name: Daily Cost Tracker

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:       # Manual trigger button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track-costs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cost tracker
        run: python -m src
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SUBSCRIPTIONS_DB_ID: ${{ secrets.NOTION_SUBSCRIPTIONS_DB_ID }}
          NOTION_USAGE_LOG_DB_ID: ${{ secrets.NOTION_USAGE_LOG_DB_ID }}
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}

      - name: Commit and push dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          git push
